<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - EBENEZER STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🏪</span>
                    <span class="logo-text">EBENEZER STORE</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="productos.html" class="nav-item" data-page="productos">
                    <span class="nav-icon">📦</span>
                    <span class="nav-text">Productos</span>
                </a>
                <a href="inventario.html" class="nav-item" data-page="inventario">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">Inventario</span>
                </a>
                <a href="ventas.html" class="nav-item" data-page="ventas">
                    <span class="nav-icon">🛒</span>
                    <span class="nav-text">Punto de Venta</span>
                </a>
                <a href="compras.html" class="nav-item" data-page="compras">
                    <span class="nav-icon">📥</span>
                    <span class="nav-text">Compras</span>
                </a>
                <a href="proveedores.html" class="nav-item" data-page="proveedores">
                    <span class="nav-icon">🏭</span>
                    <span class="nav-text">Proveedores</span>
                </a>
                <a href="banco.html" class="nav-item" data-page="banco">
                    <span class="nav-icon">🏦</span>
                    <span class="nav-text">Banco del Barrio</span>
                </a>
                <a href="reportes.html" class="nav-item active" data-page="reportes">
                    <span class="nav-icon">📈</span>
                    <span class="nav-text">Reportes</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <span class="user-name" id="userName">Administrador</span>
                        <span class="user-role">Admin</span>
                    </div>
                </div>
                <button class="btn-logout" id="btnLogout" title="Cerrar Sesión">⏻</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div class="header-left">
                    <button class="mobile-toggle" id="mobileToggle">☰</button>
                    <h1>Reportes</h1>
                </div>
                <div class="header-right" style="gap: 10px;">
                    <button class="btn btn-primary" id="btnExport">Exportar Datos</button>
                    <button class="btn btn-success" id="btnBackup">Respaldar</button>
                    <button class="btn btn-warning" id="btnRestoreClick">Restaurar</button>
                    <input type="file" id="restoreFile" accept=".json" style="display: none;">
                </div>
            </header>

            <div class="page-body">
                <!-- Report Tabs -->
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-body" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                        <div class="btn-group" id="reportTabs">
                            <button class="btn btn-primary" data-tab="ventas">Ventas</button>
                            <button class="btn btn-secondary" data-tab="compras">Compras</button>
                            <button class="btn btn-secondary" data-tab="inventario">Inventario</button>
                            <button class="btn btn-secondary" data-tab="banco">Banco del Barrio</button>
                        </div>
                        
                        <div class="btn-group" id="periodTabs">
                            <button class="btn btn-secondary" data-period="hoy">Hoy</button>
                            <button class="btn btn-secondary" data-period="semana">Esta Semana</button>
                            <button class="btn btn-secondary" data-period="mes">Este Mes</button>
                            <button class="btn btn-primary" data-period="todo">Todo</button>
                        </div>
                    </div>
                </div>

                <!-- Report Content Area -->
                <div id="reportContent" class="report-section">
                    <!-- Dynamic content rendered by JS -->
                </div>
            </div>
        </main>
    </div>

    <div id="notificationContainer"></div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reportes.js"></script>
</body>
</html>
