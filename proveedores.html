<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - Ebenezer Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🏪</span>
                    <span class="logo-text">EBENEZER STORE</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="productos.html" class="nav-item" data-page="productos">
                    <span class="nav-icon">📦</span>
                    <span class="nav-text">Productos</span>
                </a>
                <a href="inventario.html" class="nav-item" data-page="inventario">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">Inventario</span>
                </a>
                <a href="ventas.html" class="nav-item" data-page="ventas">
                    <span class="nav-icon">🛒</span>
                    <span class="nav-text">Punto de Venta</span>
                </a>
                <a href="compras.html" class="nav-item" data-page="compras">
                    <span class="nav-icon">📥</span>
                    <span class="nav-text">Compras</span>
                </a>
                <a href="proveedores.html" class="nav-item active" data-page="proveedores">
                    <span class="nav-icon">🏭</span>
                    <span class="nav-text">Proveedores</span>
                </a>
                <a href="banco.html" class="nav-item" data-page="banco">
                    <span class="nav-icon">🏦</span>
                    <span class="nav-text">Banco del Barrio</span>
                </a>
                <a href="reportes.html" class="nav-item" data-page="reportes">
                    <span class="nav-icon">📈</span>
                    <span class="nav-text">Reportes</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <span class="user-name" id="userName">Administrador</span>
                        <span class="user-role">Admin</span>
                    </div>
                </div>
                <button class="btn-logout" id="btnLogout" title="Cerrar Sesión">⏻</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div class="header-left">
                    <button class="mobile-toggle" id="mobileToggle">☰</button>
                    <h1>Proveedores</h1>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary" id="btnNuevoProveedor">Nuevo Proveedor</button>
                </div>
            </div>

            <div class="page-body">
                <div class="card">
                    <div class="card-header">
                        <div class="search-box">
                            <input type="text" id="searchInput" class="search-input" placeholder="Buscar proveedores...">
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table" id="proveedoresTable">
                                <thead>
                                    <tr>
                                        <th>Nombre</th>
                                        <th>RUC</th>
                                        <th>Teléfono</th>
                                        <th>Email</th>
                                        <th>Dirección</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be loaded here -->
                                </tbody>
                            </table>
                            <div id="emptyState" class="empty-state" style="display: none;">
                                <div class="empty-icon">🏭</div>
                                <div class="empty-text">No se encontraron proveedores</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Proveedor Modal -->
    <div class="modal" id="modalProveedor">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Proveedor</h2>
                <button class="modal-close" onclick="App.closeModal('modalProveedor')">×</button>
            </div>
            <div class="modal-body">
                <form id="proveedorForm">
                    <input type="hidden" id="proveedorId">
                    <div class="form-group">
                        <label class="form-label" for="nombre">Nombre / Razón Social *</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="ruc">RUC *</label>
                            <input type="text" id="ruc" class="form-control" required pattern="[0-9]{13}" title="Debe contener 13 dígitos">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="telefono">Teléfono</label>
                            <input type="text" id="telefono" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="direccion">Dirección</label>
                        <input type="text" id="direccion" class="form-control">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="App.closeModal('modalProveedor')">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnSaveProveedor">Guardar</button>
            </div>
        </div>
    </div>

    <div id="notificationArea"></div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/proveedores.js"></script>
</body>
</html>
