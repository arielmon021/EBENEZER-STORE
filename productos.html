<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - EBENEZER STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">🏪</span>
                <span class="logo-text">EBENEZER STORE</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item" data-page="dashboard">
                <span class="nav-icon">📊</span>
                <span class="nav-text">Dashboard</span>
            </a>
            <a href="productos.html" class="nav-item active" data-page="productos">
                <span class="nav-icon">📦</span>
                <span class="nav-text">Productos</span>
            </a>
            <a href="inventario.html" class="nav-item" data-page="inventario">
                <span class="nav-icon">📋</span>
                <span class="nav-text">Inventario</span>
            </a>
            <a href="ventas.html" class="nav-item" data-page="ventas">
                <span class="nav-icon">🛒</span>
                <span class="nav-text">Punto de Venta</span>
            </a>
            <a href="compras.html" class="nav-item" data-page="compras">
                <span class="nav-icon">📥</span>
                <span class="nav-text">Compras</span>
            </a>
            <a href="proveedores.html" class="nav-item" data-page="proveedores">
                <span class="nav-icon">🏭</span>
                <span class="nav-text">Proveedores</span>
            </a>
            <a href="banco.html" class="nav-item" data-page="banco">
                <span class="nav-icon">🏦</span>
                <span class="nav-text">Banco del Barrio</span>
            </a>
            <a href="reportes.html" class="nav-item" data-page="reportes">
                <span class="nav-icon">📈</span>
                <span class="nav-text">Reportes</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div class="user-details">
                    <span class="user-name" id="userName">Administrador</span>
                    <span class="user-role">Admin</span>
                </div>
            </div>
            <button class="btn-logout" id="btnLogout" title="Cerrar Sesión">⏻</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div class="header-left">
                <h1>Productos</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" onclick="openAddModal()">Nuevo Producto</button>
            </div>
        </header>

        <div class="page-body">
            <div class="filters-bar">
                <div class="filter-group">
                    <div class="search-box">
                        <input type="text" id="searchProducto" class="search-input" placeholder="Buscar por código o nombre...">
                    </div>
                </div>
                <div class="filter-group">
                    <select id="filterCategoria" class="form-control">
                        <option value="">Todas las Categorías</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <div class="card-body" style="padding: 0;">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Costo</th>
                                    <th>Stock</th>
                                    <th>Stock Mín.</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="productosTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Producto -->
    <div id="modalProducto" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="modalProductoTitle">Nuevo Producto</h2>
                <button class="modal-close" onclick="App.closeModal('modalProducto')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formProducto">
                    <input type="hidden" id="prodId">
                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label" for="prodCodigo">Código</label>
                            <input type="text" id="prodCodigo" class="form-control" required>
                        </div>
                        <div class="form-group" style="flex: 2;">
                            <label class="form-label" for="prodNombre">Nombre</label>
                            <input type="text" id="prodNombre" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label" for="prodCategoria">Categoría</label>
                            <select id="prodCategoria" class="form-control" required></select>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label" for="prodProveedor">Proveedor</label>
                            <select id="prodProveedor" class="form-control" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label" for="prodPrecio">Precio ($)</label>
                            <input type="number" id="prodPrecio" class="form-control" step="0.01" min="0.01" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label" for="prodCosto">Costo ($)</label>
                            <input type="number" id="prodCosto" class="form-control" step="0.01" min="0.01" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label" for="prodCantidad">Cantidad Inicial</label>
                            <input type="number" id="prodCantidad" class="form-control" min="0" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label" for="prodStockMinimo">Stock Mínimo</label>
                            <input type="number" id="prodStockMinimo" class="form-control" min="0" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="App.closeModal('modalProducto')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveProducto()">Guardar</button>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
