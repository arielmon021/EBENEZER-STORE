<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EBENEZER STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-bg">
        <div class="login-grid"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-card-top-line"></div>
            <div class="login-header">
                <div class="login-logo-wrapper">
                    <span class="logo-icon">🏪</span>
                </div>
                <h2>EBENEZER STORE</h2>
                <p>Sistema de Control de Ventas e Inventario</p>
            </div>
            <div class="login-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="username">Usuario</label>
                        <input type="text" id="username" class="form-control" placeholder="Ingrese su usuario" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña</label>
                        <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña" required autocomplete="current-password">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" style="width: 100%;">🔒 Iniciar Sesión</button>
                    </div>
                </form>
            </div>
            <hr class="login-divider">
            <div class="login-footer">
                <p class="form-text">Usuario: admin | Contraseña: admin123</p>
            </div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            DB.init();
            if (DB.isLoggedIn()) {
                window.location.href = 'dashboard.html';
            }

            const loginForm = document.getElementById('loginForm');
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!username || !password) {
                    App.showNotification('Por favor, ingrese usuario y contraseña.', 'warning');
                    return;
                }

                if (DB.login(username, password)) {
                    window.location.href = 'dashboard.html';
                } else {
                    App.showNotification('Usuario o contraseña incorrectos.', 'danger');
                }
            });
        });
    </script>
</body>
</html>
